<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="monospace" font-size="13">

  <!-- Background -->
  <rect width="900" height="500" fill="#1a1a1a"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#ccc" font-size="15" font-weight="bold">angle_engine PI Controller</text>

  <!-- ================================================================ -->
  <!-- Phase error calculation -->
  <!-- ================================================================ -->

  <!-- expected_angle box -->
  <rect x="20" y="60" width="130" height="36" rx="4" fill="#2a3a4a" stroke="#4a7a9b" stroke-width="1.5"/>
  <text x="85" y="83" text-anchor="middle" fill="#8bc4e8">expected_angle</text>

  <!-- raw_angle box -->
  <rect x="20" y="120" width="130" height="36" rx="4" fill="#2a3a4a" stroke="#4a7a9b" stroke-width="1.5"/>
  <text x="85" y="143" text-anchor="middle" fill="#8bc4e8">raw_angle (NCO)</text>

  <!-- Subtractor -->
  <circle cx="210" cy="108" r="22" fill="#1a1a1a" stroke="#aaa" stroke-width="1.5"/>
  <text x="210" y="113" text-anchor="middle" fill="#eee" font-size="18">-</text>
  <text x="198" y="103" text-anchor="middle" fill="#eee" font-size="10">+</text>

  <!-- Wires to subtractor -->
  <line x1="150" y1="78" x2="190" y2="98" stroke="#8bc4e8" stroke-width="1.5"/>
  <line x1="150" y1="138" x2="190" y2="118" stroke="#8bc4e8" stroke-width="1.5"/>

  <!-- phase_error label -->
  <line x1="232" y1="108" x2="300" y2="108" stroke="#e8c84a" stroke-width="1.5"/>
  <text x="266" y="100" text-anchor="middle" fill="#e8c44a" font-size="11">phase_error</text>
  <text x="266" y="120" text-anchor="middle" fill="#888" font-size="10">(signed 32-bit)</text>

  <!-- ================================================================ -->
  <!-- P branch -->
  <!-- ================================================================ -->

  <!-- Fork from phase_error -->
  <circle cx="300" cy="108" r="4" fill="#e8c44a"/>
  <line x1="300" y1="108" x2="300" y2="70" stroke="#e8c44a" stroke-width="1.5"/>
  <line x1="300" y1="70" x2="350" y2="70" stroke="#e8c44a" stroke-width="1.5"/>

  <!-- KP multiply -->
  <rect x="350" y="50" width="90" height="36" rx="4" fill="#2a4a2a" stroke="#4a9b4a" stroke-width="1.5"/>
  <text x="395" y="68" text-anchor="middle" fill="#8be88b">× KP</text>
  <text x="395" y="82" text-anchor="middle" fill="#888" font-size="10">reg: 0x08</text>

  <!-- p_term output -->
  <line x1="440" y1="68" x2="540" y2="68" stroke="#8be88b" stroke-width="1.5"/>
  <text x="490" y="60" text-anchor="middle" fill="#8be88b" font-size="11">p_term</text>

  <!-- ================================================================ -->
  <!-- I branch -->
  <!-- ================================================================ -->

  <!-- Fork down to integrator -->
  <line x1="300" y1="108" x2="300" y2="200" stroke="#e8c44a" stroke-width="1.5"/>
  <line x1="300" y1="200" x2="350" y2="200" stroke="#e8c44a" stroke-width="1.5"/>

  <!-- Integrator (accumulator) -->
  <rect x="350" y="180" width="90" height="36" rx="4" fill="#4a2a4a" stroke="#9b4a9b" stroke-width="1.5"/>
  <text x="395" y="197" text-anchor="middle" fill="#e88be8">Σ integrator</text>
  <text x="395" y="211" text-anchor="middle" fill="#888" font-size="10">(48-bit)</text>

  <!-- Integrator feedback arrow -->
  <path d="M 350 198 Q 320 198 320 230 Q 320 260 350 260 L 440 260 Q 460 260 460 240 L 460 216" 
        fill="none" stroke="#9b4a9b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="385" y="275" text-anchor="middle" fill="#9b4a9b" font-size="10">+= phase_error each ab_edge</text>

  <!-- integrator >> 16 -->
  <line x1="440" y1="198" x2="480" y2="198" stroke="#e88be8" stroke-width="1.5"/>
  <rect x="480" y="180" width="60" height="36" rx="4" fill="#3a2a3a" stroke="#9b4a9b" stroke-width="1"/>
  <text x="510" y="197" text-anchor="middle" fill="#e88be8" font-size="11">&gt;&gt; 16</text>
  <text x="510" y="211" text-anchor="middle" fill="#888" font-size="10">scale</text>

  <!-- KI multiply -->
  <line x1="540" y1="198" x2="560" y2="198" stroke="#e88be8" stroke-width="1.5"/>
  <line x1="560" y1="198" x2="560" y2="160" stroke="#e88be8" stroke-width="1.5"/>
  <line x1="560" y1="160" x2="590" y2="160" stroke="#e88be8" stroke-width="1.5"/>
  <rect x="590" y="142" width="90" height="36" rx="4" fill="#2a4a2a" stroke="#4a9b4a" stroke-width="1.5"/>
  <text x="635" y="160" text-anchor="middle" fill="#8be88b">× KI</text>
  <text x="635" y="174" text-anchor="middle" fill="#888" font-size="10">reg: 0x0C</text>

  <!-- i_term output -->
  <line x1="680" y1="160" x2="720" y2="160" stroke="#8be88b" stroke-width="1.5"/>
  <line x1="720" y1="160" x2="720" y2="130" stroke="#8be88b" stroke-width="1.5"/>
  <text x="700" y="152" text-anchor="middle" fill="#8be88b" font-size="11">i_term</text>

  <!-- ================================================================ -->
  <!-- Summer -->
  <!-- ================================================================ -->

  <!-- p_term wire to summer -->
  <line x1="540" y1="68" x2="720" y2="68" stroke="#8be88b" stroke-width="1.5"/>
  <line x1="720" y1="68" x2="720" y2="108" stroke="#8be88b" stroke-width="1.5"/>

  <!-- Summer circle -->
  <circle cx="720" cy="118" r="22" fill="#1a1a1a" stroke="#aaa" stroke-width="1.5"/>
  <text x="720" y="123" text-anchor="middle" fill="#eee" font-size="18">+</text>
  <line x1="720" y1="130" x2="720" y2="140" stroke="#8be88b" stroke-width="1.5"/>

  <!-- ================================================================ -->
  <!-- / 256 scale -->
  <!-- ================================================================ -->
  <rect x="690" y="140" width="60" height="30" rx="4" fill="#3a3a2a" stroke="#9b9b4a" stroke-width="1"/>
  <text x="720" y="160" text-anchor="middle" fill="#e8e88b" font-size="11">/ 256</text>

  <!-- ================================================================ -->
  <!-- Clamp -->
  <!-- ================================================================ -->
  <line x1="720" y1="170" x2="720" y2="195" stroke="#e8e88b" stroke-width="1.5"/>
  <rect x="670" y="195" width="100" height="40" rx="4" fill="#4a2a2a" stroke="#9b4a4a" stroke-width="1.5"/>
  <text x="720" y="211" text-anchor="middle" fill="#e88b8b">clamp</text>
  <text x="720" y="226" text-anchor="middle" fill="#888" font-size="10">±max_corr 0x10</text>

  <!-- correction output -->
  <line x1="720" y1="235" x2="720" y2="310" stroke="#e88b8b" stroke-width="2"/>
  <text x="740" y="280" fill="#e88b8b" font-size="11">correction</text>
  <text x="740" y="295" fill="#888" font-size="10">(signed 32-bit)</text>

  <!-- ================================================================ -->
  <!-- NCO -->
  <!-- ================================================================ -->

  <!-- nco_inc source -->
  <rect x="20" y="360" width="130" height="36" rx="4" fill="#2a3a4a" stroke="#4a7a9b" stroke-width="1.5"/>
  <text x="85" y="378" text-anchor="middle" fill="#8bc4e8">nco_inc</text>
  <text x="85" y="392" text-anchor="middle" fill="#888" font-size="10">(from divider)</text>

  <!-- NCO accumulator -->
  <rect x="250" y="350" width="140" height="56" rx="4" fill="#2a2a4a" stroke="#4a4a9b" stroke-width="1.5"/>
  <text x="320" y="372" text-anchor="middle" fill="#8b8be8">nco_accum</text>
  <text x="320" y="388" text-anchor="middle" fill="#888" font-size="10">+= nco_inc each clk</text>
  <text x="320" y="402" text-anchor="middle" fill="#888" font-size="10">- correction (on ab_edge)</text>

  <!-- Wire from nco_inc to accumulator -->
  <line x1="150" y1="378" x2="250" y2="378" stroke="#8bc4e8" stroke-width="1.5"/>

  <!-- Wire from correction to NCO -->
  <line x1="720" y1="310" x2="320" y2="310" stroke="#e88b8b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="320" y1="310" x2="320" y2="350" stroke="#e88b8b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="520" y="305" text-anchor="middle" fill="#e88b8b" font-size="11">applied on ab_edge only</text>

  <!-- NCO to raw_angle -->
  <line x1="390" y1="378" x2="460" y2="378" stroke="#8b8be8" stroke-width="1.5"/>
  <rect x="460" y="360" width="100" height="36" rx="4" fill="#2a2a4a" stroke="#4a4a9b" stroke-width="1"/>
  <text x="510" y="378" text-anchor="middle" fill="#8b8be8" font-size="11">× 7200</text>
  <text x="510" y="392" text-anchor="middle" fill="#888" font-size="10">&gt;&gt; 32</text>
  <line x1="560" y1="378" x2="620" y2="378" stroke="#8b8be8" stroke-width="1.5"/>
  <rect x="620" y="360" width="100" height="36" rx="4" fill="#2a3a4a" stroke="#4a7a9b" stroke-width="1.5"/>
  <text x="670" y="383" text-anchor="middle" fill="#8bc4e8">raw_angle</text>
  <text x="670" y="397" text-anchor="middle" fill="#888" font-size="10">0-7199</text>

  <!-- raw_angle feedback to phase error -->
  <line x1="670" y1="360" x2="670" y2="143" stroke="#8bc4e8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="670" y1="143" x2="85" y2="143" stroke="#8bc4e8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="580" y="135" fill="#8bc4e8" font-size="10">feedback</text>

  <!-- ================================================================ -->
  <!-- Gate label -->
  <!-- ================================================================ -->
  <rect x="20" y="430" width="860" height="55" rx="4" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
  <text x="450" y="450" text-anchor="middle" fill="#aaa" font-size="12">All PI updates gated on:  synced='1'  AND  ab_edge='1'  (once per tooth)</text>
  <text x="450" y="470" text-anchor="middle" fill="#888" font-size="11">Pipeline stage 1: compute p_term, i_term on ab_edge    Stage 2: sum, scale, clamp → correction (next cycle)</text>

</svg>
